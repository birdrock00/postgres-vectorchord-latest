name: Build and Push Latest VectorChord

on:
  # This build resolves mutable upstream images/releases. Run it only after
  # reviewing those changes and allowing an appropriate cooldown.
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: birdrock00/postgres-vectorchord-latest

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to the Container registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set release date tag
        id: release-date
        run: echo "tag=$(date -u +'%m-%d-%Y')" >> "$GITHUB_OUTPUT"

      # Step 1: Identify the Postgres version in the official 'latest' image
      - name: Get Postgres Major Version
        id: pg_version
        run: |
          # Pull the latest image to inspect its environment variables
          docker pull postgres:latest
          # Extract PG_MAJOR (e.g., 17)
          PG_MAJOR=$(docker run --rm postgres:latest printenv PG_MAJOR)
          echo "PG_MAJOR=$PG_MAJOR" >> $GITHUB_OUTPUT

      # Step 2: Download VectorChord matching the Postgres version
      - name: Find and Download matching VectorChord .deb
        id: get_deb
        env:
          PG_MAJOR: ${{ steps.pg_version.outputs.PG_MAJOR }}
        run: |
          # Get the latest release JSON
          RELEASE_DATA=$(curl -sL "https://api.github.com/repos/tensorchord/VectorChord/releases/latest")
          
          # Parse assets: find .deb for amd64 matching the detected PG_MAJOR version
          DEB_URL=$(echo "$RELEASE_DATA" | jq -r --argjson pg_ver "$PG_MAJOR" '
            .assets 
            | map(select(.name | endswith(".deb") and contains("amd64"))) 
            | map({name: .name, url: .browser_download_url, pg_ver: (.name | capture("postgresql-(?<ver>[0-9]+)-vchord") | .ver | tonumber)}) 
            | map(select(.pg_ver == $pg_ver))
            | .[0] 
            | .url
          ')
          
          DEB_NAME=$(echo "$RELEASE_DATA" | jq -r --argjson pg_ver "$PG_MAJOR" '
            .assets 
            | map(select(.name | endswith(".deb") and contains("amd64"))) 
            | map({name: .name, pg_ver: (.name | capture("postgresql-(?<ver>[0-9]+)-vchord") | .ver | tonumber)}) 
            | map(select(.pg_ver == $pg_ver))
            | .[0] 
            | .name
          ')
          
          if [ -z "$DEB_URL" ] || [ "$DEB_URL" = "null" ]; then
            echo "Error: Could not find a suitable .deb file for Postgres version $PG_MAJOR"
            exit 1
          fi
          
          echo "Downloading: $DEB_NAME"
          curl -sL "$DEB_URL" -o "$DEB_NAME"
          
          echo "DEB_FILENAME=$DEB_NAME" >> $GITHUB_ENV

      - name: Build and push Docker image
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.release-date.outputs.tag }}
          build-args: |
            DEB_FILENAME=${{ env.DEB_FILENAME }}

      - name: Create release for daily image
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: image-${{ steps.release-date.outputs.tag }}-${{ github.run_id }}
          name: Container image ${{ steps.release-date.outputs.tag }}
          body: |
            Container image for ${{ steps.release-date.outputs.tag }}:

            `${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.release-date.outputs.tag }}`
          make_latest: true
